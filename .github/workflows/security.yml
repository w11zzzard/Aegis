name: Security checks
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and security tooling
        run: python -m pip install -r backend/requirements-lock.txt bandit==1.9.4 pip-audit==2.10.1
      - name: Backend security regressions
        run: python -m pytest backend/tests -q --cov=backend --cov-config=backend/.coveragerc --cov-report=term-missing
      - name: Static security scan
        run: python -m bandit -r backend -x backend/tests,backend/.venv
      - name: Backend dependency advisories
        run: python -m pip_audit -r backend/requirements-lock.txt --strict
      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Frontend regressions and coverage
        working-directory: frontend
        run: npm run test:coverage
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend dependency advisories
        working-directory: frontend
        run: npm audit --audit-level=moderate
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser response lifetime regressions
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: node --test frontend/scripts/browser-response.test.mjs
      - name: Authenticated browser and API verification
        env:
          AEGIS_TEST_PYTHON: python
          PLAYWRIGHT_CHANNEL: chromium
        run: node frontend/scripts/verify-security.mjs
      - name: Browser rendering and disconnect regressions
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:e2e
      - name: Offline-runtime browser verification
        env:
          AEGIS_TEST_PYTHON: python
          PLAYWRIGHT_CHANNEL: chromium
          AEGIS_OFFLINE_GUARD: '1'
        run: node frontend/scripts/verify-security.mjs
